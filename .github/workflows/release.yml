name: Release

# A GitHub release for every version tag, with the commits since the previous one
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - run: gh release create "${{ github.ref_name }}" --title "gcast-hub ${{ github.ref_name }}" --generate-notes
